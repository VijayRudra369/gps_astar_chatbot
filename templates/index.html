<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart GPS Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Smart GPS Chatbot 🗺️</h1>

        <div id="chat" class="chat-box">
            <div class="bot">Welcome! Enter start and destination areas.</div>
        </div>

        <div class="input-container">
            <input type="text" id="start" placeholder="Start Area">
            <input type="text" id="end" placeholder="Destination Area">
            <button onclick="findRoute()">Send</button>
        </div>
    </div>

    <script>
        function appendMessage(sender, text) {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = sender;
            div.textContent = (sender === "user" ? "You: " : "Bot: ") + text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function findRoute() {
            const start = document.getElementById("start").value.trim();
            const end = document.getElementById("end").value.trim();
            if (!start || !end) {
                alert("Please enter both start and destination areas.");
                return;
            }

            appendMessage("user", `Find route from ${start} to ${end}`);

            fetch("/get_route", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `start=${start}&end=${end}`
            })
            .then(response => response.json())
            .then(data => {
                if(data.route) {
                    appendMessage("bot", data.route);
                } else {
                    appendMessage("bot", data.error || "No response found!");
                }
            });
        }
    </script>
</body>
</html>
