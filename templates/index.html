<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyderabad GPS Chatbot</title>
    <!-- Link to CSS in static folder -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Hyderabad GPS Chatbot 🗺️</h2>

    <div id="chat">
        <div class="bot">Bot: Welcome! Enter start and destination areas of Hyderabad.</div>
        <div class="bot">Bot: Available areas: Hyderabad, Secunderabad, LB Nagar, Banjara Hills, Gachibowli, Hitech City, Medchal, Miyapur</div>
    </div>

    <div class="input-container">
        <input type="text" id="start" placeholder="Start Area">
        <input type="text" id="end" placeholder="Destination Area">
        <button onclick="findRoute()">Find Route</button>
    </div>

    <script>
        function appendMessage(sender, text) {
            let chat = document.getElementById("chat");
            let div = document.createElement("div");
            div.className = sender;
            div.textContent = (sender === "user" ? "You: " : "Bot: ") + text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function findRoute() {
            let start = document.getElementById("start").value.trim();
            let end = document.getElementById("end").value.trim();
            if (!start || !end) {
                alert("Please enter both start and destination areas.");
                return;
            }

            appendMessage("user", `Find route from ${start} to ${end}`);

            fetch("/get_route", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `start=${start}&end=${end}`
            })
            .then(response => response.json())
            .then(data => {
                if(data.route) {
                    appendMessage("bot", "Shortest route: " + data.route.join(" -> "));
                } else {
                    appendMessage("bot", data.error || "No route found!");
                }
            });
        }
    </script>
</body>
</html>
